name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18.7-alpine
                env:
                    POSTGRES_DB: lightlms_test
                    POSTGRES_USER: lightlms
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U lightlms"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl, pdo_pgsql, zip, bcmath
                  coverage: none

            - name: Cache Composer packages
              uses: ramsey/composer-install@v3
              with:
                  composer-options: --no-interaction --prefer-dist

            - name: Copy environment
              run: cp .env.example .env

            - name: Generate app key
              run: php artisan key:generate

            - name: Run migrations
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: lightlms_test
                  DB_USERNAME: lightlms
                  DB_PASSWORD: secret
              run: php artisan migrate --force

            - name: Run tests
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: lightlms_test
                  DB_USERNAME: lightlms
                  DB_PASSWORD: secret
              run: php artisan test

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Type check
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Build assets
              run: pnpm run build

    docker:
        name: Docker build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  load: true
                  tags: lightlms:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test container
              run: |
                  docker run -d --name lightlms-ci -p 8000:8000 \
                    -e APP_KEY=base64:$(head -c 32 /dev/urandom | base64) \
                    -e DB_CONNECTION=sqlite \
                    lightlms:ci
                  sleep 10
                  curl -fsS http://127.0.0.1:8000/up || (docker logs lightlms-ci; exit 1)
                  docker rm -f lightlms-ci
