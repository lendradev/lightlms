name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        services:
            postgres:
                image: postgres:18.7-alpine
                env:
                    POSTGRES_DB: lightlms_test
                    POSTGRES_USER: lightlms
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U lightlms"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl, pdo_pgsql, zip, bcmath
                  coverage: none

            - name: Copy environment
              run: cp .env.example .env

            - name: Install PHP dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
              with:
                  dependency-versions: locked
                  composer-options: --no-interaction --prefer-dist

            - name: Generate app key
              run: php artisan key:generate

            - name: Run migrations
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: lightlms_test
                  DB_USERNAME: lightlms
                  DB_PASSWORD: secret
              run: php artisan migrate --force

            - name: Run tests
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: lightlms_test
                  DB_USERNAME: lightlms
                  DB_PASSWORD: secret
              run: php artisan test

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.3
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Type check
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Build assets
              run: pnpm run build

    docker:
        name: Docker build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: false
                  load: true
                  tags: lightlms:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test container
              run: |
                  docker run -d --name lightlms-ci -p 8000:8000 \
                    -e "APP_KEY=base64:$(head -c 32 /dev/urandom | base64)" \
                    -e DB_CONNECTION=sqlite \
                    lightlms:ci
                  sleep 10
                  curl -fsS http://127.0.0.1:8000/up || (docker logs lightlms-ci; exit 1)
                  docker rm -f lightlms-ci
