<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="LightLMS — a self-hosted open-source learning management system">
    <defs>
        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0D1934"/>
            <stop offset="55%" stop-color="#1A2E5B"/>
            <stop offset="100%" stop-color="#2D5ED4"/>
        </linearGradient>
        <radialGradient id="tealGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#3FB690" stop-opacity="0.40"/>
            <stop offset="100%" stop-color="#3FB690" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cornerGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#74A1FF" stop-opacity="0.26"/>
            <stop offset="60%" stop-color="#74A1FF" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#74A1FF" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#74A1FF" stroke-opacity="0.07" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="1280" height="640" fill="url(#ink)"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <ellipse cx="1080" cy="120" rx="420" ry="260" fill="url(#tealGlow)"/>
    <ellipse cx="60" cy="640" rx="520" ry="360" fill="url(#cornerGlow)"/>

    <!-- Course outline motif: modules holding lessons -->
    <g opacity="0.30" transform="translate(880, 150)">
        <rect x="0" y="0" width="320" height="300" rx="10" fill="#F9FAFD" fill-opacity="0.05" stroke="#74A1FF" stroke-opacity="0.35"/>
        <rect x="24" y="30" width="180" height="10" rx="5" fill="#74A1FF" fill-opacity="0.75"/>
        <rect x="24" y="66" width="272" height="44" rx="7" fill="#74A1FF" fill-opacity="0.16"/>
        <rect x="40" y="82" width="120" height="9" rx="4.5" fill="#F9FAFD" fill-opacity="0.80"/>
        <circle cx="268" cy="88" r="9" fill="#3FB690" fill-opacity="0.85"/>
        <rect x="24" y="122" width="272" height="44" rx="7" fill="#74A1FF" fill-opacity="0.11"/>
        <rect x="40" y="138" width="152" height="9" rx="4.5" fill="#F9FAFD" fill-opacity="0.62"/>
        <circle cx="268" cy="144" r="9" fill="#EEB154" fill-opacity="0.85"/>
        <rect x="24" y="178" width="272" height="44" rx="7" fill="#74A1FF" fill-opacity="0.11"/>
        <rect x="40" y="194" width="104" height="9" rx="4.5" fill="#F9FAFD" fill-opacity="0.62"/>
        <circle cx="268" cy="200" r="9" fill="#74A1FF" fill-opacity="0.55"/>
        <rect x="24" y="234" width="272" height="44" rx="7" fill="#74A1FF" fill-opacity="0.11"/>
        <rect x="40" y="250" width="136" height="9" rx="4.5" fill="#F9FAFD" fill-opacity="0.62"/>
        <circle cx="268" cy="256" r="9" fill="#74A1FF" fill-opacity="0.55"/>
    </g>

    <!-- Mark: an open book rendered as a single weight -->
    <g transform="translate(96, 150)">
        <rect width="76" height="76" rx="14" fill="#74A1FF"/>
        <path d="M14 26c8-3 14-3 20 0v28c-6-3-12-3-20 0z" fill="#0D1934" fill-opacity="0.92"/>
        <path d="M62 26c-8-3-14-3-20 0v28c6-3 12-3 20 0z" fill="#0D1934" fill-opacity="0.92"/>
        <rect x="36" y="24" width="4" height="32" rx="2" fill="#74A1FF"/>
    </g>

    <text x="96" y="316" font-family="Source Serif 4" font-size="76" font-weight="700" fill="#F9FAFD" letter-spacing="-1.5">LightLMS</text>

    <text x="96" y="372" font-family="Inter" font-size="25" font-weight="400" fill="#B4BED2">A self-hosted, open-source learning management system.</text>

    <g font-family="Inter" font-size="19" font-weight="600">
        <rect x="96" y="404" width="176" height="46" rx="23" fill="#74A1FF" fill-opacity="0.16" stroke="#74A1FF" stroke-opacity="0.45"/>
        <text x="184" y="433" fill="#C9DBFF" text-anchor="middle">Laravel 13</text>

        <rect x="288" y="404" width="192" height="46" rx="23" fill="#74A1FF" fill-opacity="0.16" stroke="#74A1FF" stroke-opacity="0.45"/>
        <text x="384" y="433" fill="#C9DBFF" text-anchor="middle">Inertia · React 19</text>

        <rect x="496" y="404" width="164" height="46" rx="23" fill="#3FB690" fill-opacity="0.16" stroke="#3FB690" stroke-opacity="0.45"/>
        <text x="578" y="433" fill="#A8E6D2" text-anchor="middle">MIT licensed</text>

        <rect x="676" y="404" width="158" height="46" rx="23" fill="#EEB154" fill-opacity="0.14" stroke="#EEB154" stroke-opacity="0.40"/>
        <text x="755" y="433" fill="#F6D6A4" text-anchor="middle">Docker ready</text>
    </g>

    <rect x="96" y="486" width="4" height="54" rx="2" fill="#3FB690"/>
    <text x="116" y="510" font-family="Inter" font-size="20" font-weight="600" fill="#F9FAFD">Courses · Assignments · Quizzes · Gradebook · Certificates</text>
    <text x="116" y="536" font-family="Inter" font-size="19" font-weight="400" fill="#B4BED2">Runs on infrastructure you control.</text>
</svg>
